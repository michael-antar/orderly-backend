# === Core settings (mirrors application.properties — test file shadows main) ===

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.locations=classpath:db/migration

# Jackson — serialize Instant as ISO-8601 string, not epoch seconds (Jackson 3: DateTimeFeature)
spring.jackson.datatype.datetime.write-dates-as-timestamps=false

# Mail (Resend SMTP)
spring.mail.host=smtp.resend.com
spring.mail.port=465
spring.mail.username=resend
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true

# OpenAPI / springdoc
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui

# === Test overrides ===

# Disable Docker Compose — Testcontainers manages the database
spring.docker.compose.enabled=false

# Stub out env-var-backed secrets with safe test values
app.jwt.secret=test-secret-key-for-junit-tests-only!
spring.mail.password=test-api-key
app.mail.from=noreply@example.com
app.frontend.base-url=http://localhost:5173
